model_name_or_path: microsoft/Phi-3.5-vision-instruct
dataset: ./data/uavon_phi35_sft.jsonl
output_dir: ./outputs/phi35_uavon_lora_r256_native

flash_attn: fa2
cutoff_len: 2048
seed: 42

finetuning_type: lora
lora_rank: 256
lora_alpha: 512
lora_dropout: 0.05
lora_target: qkv_proj,o_proj,gate_up_proj,down_proj,q_proj,k_proj,v_proj,out_proj,fc1,fc2

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
fp16: false
optim: adafactor
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
ddp_find_unused_parameters: true
max_grad_norm: 1.0

logging_steps: 10
save_steps: 1000
save_total_limit: 3
overwrite_output_dir: true
report_to: none
dataloader_num_workers: 4
